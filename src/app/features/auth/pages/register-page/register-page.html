<section class="auth-card">
  <h1 class="auth-card__title">Регистрация</h1>
  <p class="auth-card__hint">Создайте аккаунт, чтобы сохранять рецепты в избранное</p>

  <form class="auth-card__form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <label class="field">
      <span class="field__label">Имя</span>
      <input class="field__input" type="text" formControlName="name" placeholder="Как вас зовут?" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span class="field__error">Укажите имя</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Email</span>
      <input class="field__input" type="email" formControlName="email" placeholder="you@example.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <span class="field__error">Введите корректный email</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Пароль</span>
      <input class="field__input" type="password" formControlName="password" placeholder="Минимум 6 символов" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field__error">Пароль не короче 6 символов</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Повторите пароль</span>
      <input class="field__input" type="password" formControlName="confirmPassword" placeholder="Ещё раз" />
      @if (form.controls.confirmPassword.touched && form.hasError('passwordsMatch')) {
        <span class="field__error">Пароли не совпадают</span>
      }
    </label>

    <button class="auth-card__submit" type="submit" [disabled]="submitting.active()">
      {{ submitting.active() ? 'Создание…' : 'Зарегистрироваться' }}
    </button>
  </form>

  <p class="auth-card__footer">
    Уже есть аккаунт? <a href="/auth/login">Войти</a>
  </p>
</section>
